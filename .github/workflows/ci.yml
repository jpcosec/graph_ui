name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mindmap:
    name: pytest + node --test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    # The store is derived (.sldb/store.yaml): it links ../../deskops/.sldb, so graph_ui is checked
    # out at UIs/graph_ui with deskops beside it, the same relative layout as on a workstation.
    defaults:
      run:
        working-directory: UIs/graph_ui
    steps:
      - uses: actions/checkout@v4
        with:
          path: UIs/graph_ui
      - uses: actions/checkout@v4
        with:
          repository: jpcosec/opsys
          path: deskops
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            UIs/graph_ui/pyproject.toml
            UIs/graph_ui/.github/requirements-suite.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install graph_ui and the suite
        run: python -m pip install --src "$RUNNER_TEMP/suite-src" -r .github/requirements-suite.txt -e ".[test]"
      - name: Build the stores (deskops, then graph_ui) from their declarations
        run: |
          (cd ../../deskops && sldb stores build)
          sldb stores build
      - name: The versioned sources rebuild the store
        run: sldb stores build --check
      - name: pytest
        # The e2e_* files drive a browser; they run in the e2e job.
        run: python -m pytest tests -q -rs --ignore-glob='tests/e2e_*'
      - name: node --test
        run: node --test tests/*.test.mjs

  review-workbench:
    name: review-workbench (tsc, vitest, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/review-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/review-workbench/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: vitest
        run: npx vitest run
      - name: Architecture lint
        run: node scripts/lint-architecture.mjs

  e2e:
    name: e2e (Playwright, chromium, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    # The store is derived (.sldb/store.yaml): it links ../../deskops/.sldb, so graph_ui is checked
    # out at UIs/graph_ui with deskops beside it, the same relative layout as on a workstation.
    defaults:
      run:
        working-directory: UIs/graph_ui
    steps:
      - uses: actions/checkout@v4
        with:
          path: UIs/graph_ui
      - uses: actions/checkout@v4
        with:
          repository: jpcosec/opsys
          path: deskops
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            UIs/graph_ui/pyproject.toml
            UIs/graph_ui/.github/requirements-suite.txt
      - name: Install graph_ui and the suite
        run: python -m pip install --src "$RUNNER_TEMP/suite-src" -r .github/requirements-suite.txt -e ".[test]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UIs/graph_ui/apps/review-workbench/package-lock.json
      - name: review-workbench dependencies (its e2e builds and previews the app)
        run: npm ci
        working-directory: UIs/graph_ui/apps/review-workbench
      - name: Build the stores (deskops, then graph_ui) from their declarations
        run: |
          (cd ../../deskops && sldb stores build)
          sldb stores build
      - name: Install chromium
        run: python -m playwright install --with-deps chromium
      - name: e2e
        run: python -m pytest tests/e2e_*.py -q -rs
