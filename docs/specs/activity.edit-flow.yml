id: activity.edit-flow
title: graph_ui - Operator Edit Flow
type: activity
version: "0.1"

data:
  start: load_graph

  steps:
    load_graph:
      label: Load graph into store
      next: select

    select:
      label: Select node or edge
      kind: decision
      branches:
        node: edit_node
        edge: edit_edge
        empty: create

    create:
      label: Create node (drag type / Ctrl+K / right-click), canvas only
      next: record_action

    edit_node:
      label: Open Node Inspector (double click), edit typed fields
      next: save_document

    edit_edge:
      label: Open Edge Inspector, edit relation type, canvas only
      next: record_action

    record_action:
      label: Store records the semantic action (undoable, not persisted)
      next: more_edits

    save_document:
      label: Save the document (sldbProvider.saveDoc -> POST /sldb/save)
      next: persisted_check

    persisted_check:
      label: Persisted by sldb serve?
      kind: decision
      branches:
        "yes": update_node
        "no": save_failed

    update_node:
      label: Update the node in the graph store, close the inspector
      next: more_edits

    save_failed:
      label: Show the error in the inspector, keep the draft
      next: more_edits

    more_edits:
      label: More edits?
      kind: decision
      branches:
        "yes": select
        "no": end

  end: end
