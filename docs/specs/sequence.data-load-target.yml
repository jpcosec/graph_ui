id: sequence.data-load-target
title: graph_ui - Data Load + per-document Save (target, over sldb.api.graph)
type: sequence
version: "0.1"
data:
  participants:
    - id: Operator
      kind: actor
    - id: DataProvider
      kind: component
    - id: SnapshotAdapter
      kind: component
    - id: SldbGraph
      kind: boundary
    - id: GraphStore
      kind: component
    - id: Canvas
      kind: component
  messages:
    - from: Operator
      to: DataProvider
      message: open editor
    - from: DataProvider
      to: SldbGraph
      message: fetch GraphSnapshot
      kind: sync
    - from: SldbGraph
      to: SnapshotAdapter
      message: GraphSnapshot
      kind: reply
    - from: SnapshotAdapter
      to: DataProvider
      message: snapshot_to_ui_graph -> GraphData
      kind: reply
    - from: DataProvider
      to: GraphStore
      message: loadGraph(nodes, edges)
      kind: sync
    - from: Operator
      to: Canvas
      message: edit node/edge/attribute
    - from: Canvas
      to: GraphStore
      message: updateNode/addEdge/removeElements
      kind: sync
    - from: Operator
      to: DataProvider
      message: save one document (NodeInspector)
    - from: DataProvider
      to: SldbGraph
      message: POST /sldb/save (that document only)
      kind: sync
    - from: SldbGraph
      to: DataProvider
      message: ok
      kind: reply
