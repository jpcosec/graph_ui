id: sequence.data-load
title: graph_ui - Data Load Flow (current, review-workbench)
type: sequence
version: "0.2"
data:
  participants:
    - id: App
      kind: component
    - id: AntoniaFlowPage
      kind: component
    - id: SldbProvider
      kind: component
    - id: SldbServe
      kind: boundary
    - id: Adapter
      kind: component
    - id: GraphStore
      kind: component
  messages:
    - from: App
      to: AntoniaFlowPage
      message: mount default page
    - from: AntoniaFlowPage
      to: SldbProvider
      message: getSchema() + getGraph()
      kind: sync
    - from: SldbProvider
      to: SldbServe
      message: GET /sldb/schema, /sldb/graph (Vite proxy)
      kind: sync
    - from: SldbServe
      to: SldbProvider
      message: schema + documents
      kind: reply
    - from: AntoniaFlowPage
      to: Adapter
      message: buildAntoniaGraphFromDocuments (?src=fixture uses the generated fixture)
      kind: sync
    - from: Adapter
      to: AntoniaFlowPage
      message: nodes + edges (elk-layered layout)
      kind: reply
    - from: AntoniaFlowPage
      to: GraphStore
      message: loadGraph(nodes, edges)
      kind: sync
    - from: GraphStore
      to: AntoniaFlowPage
      message: in-memory draft graph
      kind: reply
