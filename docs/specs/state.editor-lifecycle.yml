id: state.editor-lifecycle
title: graph_ui - Editor Lifecycle (AntoniaFlowPage, per-document save)
type: state
version: "0.2"
data:
  entity: EditorSession
  initial: loading
  states:
    - id: loading
      label: Loading (sldb serve /schema + /graph, or ?src=fixture)
    - id: ready
      label: Ready (graph in the store; canvas edits are not persisted)
    - id: error
      label: Error (schema/data failure, banner over the canvas)
    - id: inspecting
      label: Inspecting a document (NodeInspector, opened by double click)
    - id: saving
      label: Saving the document (sldbProvider.saveDoc -> POST /sldb/save)
  transitions:
    - from: loading
      to: ready
      "on": data_ready
    - from: loading
      to: error
      "on": fetch_failed
    - from: ready
      to: inspecting
      "on": double_click_node
    - from: inspecting
      to: ready
      "on": close
    - from: inspecting
      to: saving
      "on": save_document
    - from: saving
      to: ready
      "on": persisted
    - from: saving
      to: inspecting
      "on": save_failed
    - from: ready
      to: loading
      "on": reload
