# Modelo de variabilidad de graph-ui.uvl como mundo pron (generado por mundo-desde-uvl.py).
modelos:
- name: Feature
  family: variabilidad
  template: '---

    name: ⸢rev•name⸥

    variability: ⸢rev•variability⸥

    group: ⸢rev•group⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Nombre de la feature.
  - name: variability
    type: str
    description: mandatory u optional respecto de su padre (en grupos or y alternative, optional).
  - name: group
    type: str
    default: and
    description: 'Cómo se eligen sus hijas: and (cada una por su variability), or (al menos una), alternative (exactamente una).'
- name: Constraint
  family: variabilidad
  template: '---

    formula: ⸢rev•formula⸥

    ---


    # Restricción

    '
  fields:
  - name: formula
    type: str
    description: Fórmula proposicional sobre nombres de features, en sintaxis UVL.
tipos_de_relacion:
- name: subfeature_of
  cardinality: many_to_one
  axis: WHAT
  source_types:
  - Feature
  target_types:
  - Feature
  description: La feature origen refina a la destino.
- name: mentions
  cardinality: many_to_many
  axis: WHAT
  source_types:
  - Constraint
  target_types:
  - Feature
  description: La restricción nombra a la feature (la fórmula queda en el campo).
