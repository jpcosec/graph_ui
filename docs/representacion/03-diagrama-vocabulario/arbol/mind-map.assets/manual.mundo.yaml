# Estructura de este manual como mundo tipado (generado por mundo-desde-manual.py). Cuatro verbos de pertenencia.
modelos:
- name: Manual
  family: manual
  template: '---

    title: ⸢rev•title⸥

    ---


    # ⸢render•title⸥

    '
  fields: &id001
  - name: title
    type: str
    description: Título (el H1 del archivo).
- name: Axis
  family: manual
  template: '---

    title: ⸢rev•title⸥

    ---


    # ⸢render•title⸥

    '
  fields: *id001
- name: Folder
  family: manual
  template: '---

    title: ⸢rev•title⸥

    ---


    # ⸢render•title⸥

    '
  fields: *id001
- name: Document
  family: manual
  template: '---

    title: ⸢rev•title⸥

    ---


    # ⸢render•title⸥

    '
  fields: *id001
tipos_de_relacion:
- name: axis_of
  cardinality: many_to_one
  axis: WHERE
  source_types:
  - Axis
  target_types:
  - Manual
  description: El eje es parte del manual.
- name: folder_of
  cardinality: many_to_one
  axis: WHERE
  source_types:
  - Folder
  target_types:
  - Axis
  description: La carpeta (dónde vive el significado) es parte del eje.
- name: chapter_of
  cardinality: many_to_one
  axis: WHERE
  source_types:
  - Document
  target_types:
  - Axis
  description: El documento es un capítulo directo del eje.
- name: example_of
  cardinality: many_to_one
  axis: WHERE
  source_types:
  - Document
  target_types:
  - Folder
  description: El documento es un ejemplo de la carpeta.
