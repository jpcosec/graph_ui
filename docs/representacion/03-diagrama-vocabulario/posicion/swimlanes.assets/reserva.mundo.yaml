# Proceso por carriles como mundo pron: el carril es un verbo (performed_by, many_to_one) y el orden
# horizontal de los carriles es un campo (Participant.position). El flujo es el verbo next.
modelos:
- name: Participant
  family: proceso
  template: '---

    name: ⸢rev•name⸥

    position: ⸢rev•position⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Rol, sistema o área responsable.
  - name: position
    type: int
    description: Orden del carril de izquierda a derecha.
- name: Action
  family: proceso
  template: '---

    name: ⸢rev•name⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Qué se hace.
- name: ControlNode
  family: proceso
  template: '---

    kind: ⸢rev•kind⸥

    ---


    # ⸢render•kind⸥

    '
  fields:
  - name: kind
    type: str
    description: initial, final, decision o merge.
tipos_de_relacion:
- name: performed_by
  cardinality: many_to_one
  axis: WHO
  source_types:
  - Action
  - ControlNode
  target_types:
  - Participant
  description: El paso está en el carril de ese participante (UML ActivityPartition, BPMN Lane).
- name: next
  cardinality: many_to_many
  axis: WHEN
  source_types:
  - Action
  - ControlNode
  target_types:
  - Action
  - ControlNode
  description: 'Flujo de control: después de este paso viene ese. La guarda de una decisión va en notes.'
