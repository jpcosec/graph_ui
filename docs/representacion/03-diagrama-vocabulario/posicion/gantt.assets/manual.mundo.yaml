# Plan real de este manual como mundo pron: una tarea por commit de docs/representacion (e69261f..26efd02),
# de la fecha del commit anterior a la de su commit. La primera tarea dura 0 (no se sabe cuándo empezó).
modelos:
- name: Phase
  family: plan
  template: '---

    name: ⸢rev•name⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Fase del trabajo.
- name: Task
  family: plan
  template: '---

    commit: ⸢rev•commit⸥

    start: ⸢rev•start⸥

    end: ⸢rev•end⸥

    ---


    # ⸢rev•title⸥

    '
  fields:
  - name: title
    type: str
    description: Qué se hizo.
  - name: commit
    type: str
    description: Commit que cierra la tarea.
  - name: start
    type: str
    description: Inicio, 'YYYY-MM-DD HH:MM' (el commit anterior).
  - name: end
    type: str
    description: Fin, 'YYYY-MM-DD HH:MM' (fecha del commit).
tipos_de_relacion:
- name: part_of
  cardinality: many_to_one
  axis: WHERE
  source_types:
  - Task
  target_types:
  - Phase
  description: La tarea pertenece a la fase.
- name: depends_on
  cardinality: many_to_many
  axis: WHEN
  source_types:
  - Task
  target_types:
  - Task
  description: 'La tarea origen no empieza antes de que termine la destino (condition: el fin de la destino <= el inicio del origen).'
  condition: end <= "{start}"
