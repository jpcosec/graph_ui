69261f-text" font-size="11" x="90" y="63.5" class="taskTextOutsideRight taskTextOutside0  milestoneText width-252.8134765625">andamiaje del manual de representación semántica </text><text id="my-svg-t-832925f-text" font-size="11" x="205" y="87.5" class="taskText taskText1  width-217.5673828125">eje 1, fundamentos con ejemplos verificados </text><text id="my-svg-t-2f7d43a-text" font-size="11" x="535" y="111.5" class="taskTextOutsideRight taskTextOutside2  width-221.853515625">eje 2, prior art con código de fuentes oficiales </text><text id="my-svg-t-c1d54b9-text" font-size="11" x="697" y="135.5" class="taskTextOutsideRight taskTextOutside3  width-291.7529296875">eje 3, UML de clases con mundo pron y controles negativos </text><text id="my-svg-t-8424daf-text" font-size="11" x="778" y="159.5" class="taskTextOutsideRight taskTextOutside3  width-208.765625">eje 3, entidad-relación (Chen y crow's foot) </text><text id="my-svg-t-aed6e95-text" font-size="11" x="859" y="183.5" class="taskTextOutsideRight taskTextOutside3  width-274.53125">eje 3, ArchiMate con la gramática de Archi como oráculo </text><text id="my-svg-t-282eca7-text" font-size="11" x="973" y="207.5" class="taskTextOutsideRight taskTextOutside3  width-282.484375">eje 3, mapa conceptual y VOWL; cierra nodo-arista tipado </text><text id="my-svg-t-62c4751-text" font-size="11" x="1038" y="231.5" class="taskTextOutsideRight taskTextOutside0  width-278.421875">eje 3, paquetes UML (primer documento de anidamiento) </text><text id="my-svg-t-3fd446a-text" font-size="11" x="1028" y="255.5" class="taskTextOutsideLeft taskTextOutside0">eje 3, modelo C4 con relaciones implícitas derivadas </text><text id="my-svg-t-653f9ea-text" font-size="11" x="1093" y="279.5" class="taskTextOutsideLeft taskTextOutside0">eje 3, despliegue UML (anidamiento vs «deploy») </text><text id="my-svg-t-c97d21c-text" font-size="11" x="1125" y="303.5" class="taskTextOutsideLeft taskTextOutside0">eje 3, treemap; cierra la carpeta de anidamiento </text><text id="my-svg-t-9a696dd-text" font-size="11" x="1207" y="327.5" class="taskTextOutsideLeft taskTextOutside1">eje 3, diagrama de secuencia (el orden como posición) </text><text id="my-svg-t-26efd02-text" font-size="11" x="1255" y="351.5" class="taskTextOutsideLeft taskTextOutside1">eje 3, carriles (particiones UML y lanes BPMN) </text></g><g><text dy="0em" x="10" y="62" font-size="11" class="sectionTitle sectionTitle0"><tspan alignment-baseline="central" x="10">Andamiaje</tspan></text><text dy="0em" x="10" y="86" font-size="11" class="sectionTitle sectionTitle1"><tspan alignment-baseline="central" x="10">Eje 1 · fundamentos</tspan></text><text dy="0em" x="10" y="110" font-size="11" class="sectionTitle sectionTitle2"><tspan alignment-baseline="central" x="10">Eje 2 · prior art</tspan></text><text dy="0em" x="10" y="170" font-size="11" class="sectionTitle sectionTitle3"><tspan alignment-baseline="central" x="10">Eje 3 · nodo-arista tipado</tspan></text><text dy="0em" x="10" y="266" font-size="11" class="sectionTitle sectionTitle0"><tspan alignment-baseline="central" x="10">Eje 3 · anidamiento</tspan></text><text dy="0em" x="10" y="338" font-size="11" class="sectionTitle sectionTitle1"><tspan alignment-baseline="central" x="10">Eje 3 · posición</tspan></text></g><g class="today"><line x1="1327" x2="1327" y1="25" y2="387" class="today"/></g><text x="692" y="25" class="titleText">Plan real del manual de representación (un commit por tarea)</text></svg>