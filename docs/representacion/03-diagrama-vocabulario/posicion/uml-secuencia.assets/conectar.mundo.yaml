# Diagrama de secuencia como dominio de un mundo pron: el orden en el tiempo es un campo (Message.order),
# no una relación; quién envía y quién recibe son verbos. Generado desde conectar.spec2viz.yml.
modelos:
- name: Interaction
  family: uml
  template: '---

    name: ⸢rev•name⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Nombre de la interacción.
- name: Lifeline
  family: uml
  template: '---

    name: ⸢rev•name⸥

    kind: ⸢rev•kind⸥

    position: ⸢rev•position⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Participante.
  - name: kind
    type: str
    default: component
    description: actor, component, boundary.
  - name: position
    type: int
    description: Orden de izquierda a derecha.
- name: Message
  family: uml
  template: '---

    order: ⸢rev•order⸥

    sort: ⸢rev•sort⸥

    ---


    # ⸢rev•text⸥

    '
  fields:
  - name: text
    type: str
    description: Rótulo del mensaje.
  - name: order
    type: int
    description: Posición en la secuencia (tiempo hacia abajo).
  - name: sort
    type: str
    default: synchCall
    description: synchCall, asynchCall o reply (UML messageSort).
tipos_de_relacion:
- name: in_interaction
  cardinality: many_to_one
  source_types:
  - Lifeline
  - Message
  target_types:
  - Interaction
  description: El participante o mensaje pertenece a la interacción.
- name: sends
  cardinality: many_to_one
  source_types:
  - Message
  target_types:
  - Lifeline
  description: Línea de vida que envía el mensaje.
- name: receives
  cardinality: many_to_one
  source_types:
  - Message
  target_types:
  - Lifeline
  description: Línea de vida que recibe el mensaje.
