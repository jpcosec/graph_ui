# Árbol de frontends/mindmap de graph_ui (commit 653f9ea) como mundo pron: carpetas y archivos con sus líneas.
# El tamaño de una carpeta NO se guarda: es la suma de sus archivos y lo calcula la vista.
modelos:
- name: Folder
  family: codigo
  template: '---

    name: ⸢rev•name⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Nombre de la carpeta.
- name: SourceFile
  family: codigo
  template: '---

    name: ⸢rev•name⸥

    lines: ⸢rev•lines⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Nombre del archivo.
  - name: lines
    type: int
    description: Líneas del archivo (wc -l).
tipos_de_relacion:
- name: in_folder
  cardinality: many_to_one
  axis: WHERE
  source_types:
  - Folder
  - SourceFile
  target_types:
  - Folder
  description: El archivo o carpeta está dentro de esa carpeta.
