# La ontología de conocimiento.ttl como ESQUEMA de un mundo pron (opción A):
# owl:Class = modelo, owl:DatatypeProperty = campo, owl:ObjectProperty = RelationTypeDoc
# (rdfs:domain = source_types, rdfs:range = target_types). rdfs:subClassOf no se puede declarar por CLI
# (sldb models create con base: importa la base desde sldb), así que CliCommand va en source_types.
modelos:
  - name: Surface
    family: kb
    template: |
      ---
      surface: ⸢rev•surface⸥
      ---

      # ⸢render•surface⸥
    fields:
      - {name: surface, type: str, description: "Módulo de código."}
  - name: CliCommand
    family: kb
    template: |
      ---
      command_path: ⸢rev•command_path⸥
      ---

      # ⸢render•command_path⸥
    fields:
      - {name: command_path, type: str, description: "Ruta del comando en el CLI."}
  - name: Spec
    family: kb
    template: |
      ---
      title: ⸢rev•title⸥
      ---

      # ⸢render•title⸥
    fields:
      - {name: title, type: str, description: "Título del capítulo."}

tipos_de_relacion:
  - {name: implements, cardinality: many_to_many, axis: HOW, source_types: [Surface, CliCommand], target_types: [Spec],
     description: "Este módulo o comando implementa ese capítulo del spec."}

documentos:
  - {model: Surface, name: surface-pron-world, payload: {surface: pron.world}}
  - {model: CliCommand, name: cli-pron-refresh, payload: {command_path: pron refresh}}
  - {model: Spec, name: spec-01, payload: {title: "01 · mundo"}}

relaciones:
  - {type: implements, source: "Surface:surface-pron-world", target: "Spec:spec-01"}
  - {type: implements, source: "CliCommand:cli-pron-refresh", target: "Spec:spec-01"}

relaciones_invalidas:
  - {type: implements, source: "Spec:spec-01", target: "Surface:surface-pron-world",
     porque: "rango y dominio invertidos"}
