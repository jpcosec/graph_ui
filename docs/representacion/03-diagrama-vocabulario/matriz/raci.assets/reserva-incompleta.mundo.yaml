# Variante: 'Registrar la reserva' queda sin R, y el Gerente es C e I a la vez en 'Buscar mesa'.
modelos:
- name: Activity
  family: raci
  template: '---

    name: ⸢rev•name⸥

    position: ⸢rev•position⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Tarea o entregable.
  - name: position
    type: int
    description: Orden de la fila.
- name: Role
  family: raci
  template: '---

    name: ⸢rev•name⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Rol o parte interesada.
tipos_de_relacion:
- name: responsible
  cardinality: many_to_many
  axis: WHO
  source_types:
  - Activity
  target_types:
  - Role
  description: 'R: Quien hace la tarea.'
- name: accountable
  cardinality: many_to_one
  axis: WHO
  source_types:
  - Activity
  target_types:
  - Role
  description: 'A: Quien responde en última instancia; uno por tarea.'
- name: consulted
  cardinality: many_to_many
  axis: WHO
  source_types:
  - Activity
  target_types:
  - Role
  description: 'C: Quien opina antes (comunicación en dos sentidos).'
- name: informed
  cardinality: many_to_many
  axis: WHO
  source_types:
  - Activity
  target_types:
  - Role
  description: 'I: Quien se entera (un sentido).'
documentos:
- model: Activity
  name: t-interpretar
  payload:
