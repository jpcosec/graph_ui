    position: 4
- model: Activity
  name: t-avisar
  payload:
    name: Avisar al cliente
    position: 5
- model: Role
  name: r-cliente
  payload:
    name: Cliente
- model: Role
  name: r-pron
  payload:
    name: pron
- model: Role
  name: r-personal
  payload:
    name: Personal
- model: Role
  name: r-gerente
  payload:
    name: Gerente
relaciones:
- type: responsible
  source: Activity:t-interpretar
  target: Role:r-pron
- type: accountable
