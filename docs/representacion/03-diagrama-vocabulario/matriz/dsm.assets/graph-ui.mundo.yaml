# DSM de componentes de graph_ui (frontends/mindmap), generada por mundo-desde-imports.py desde los imports relativos.
modelos:
- name: Component
  family: dsm
  template: '---

    path: ⸢rev•path⸥

    modules: ⸢rev•modules⸥

    ---


    # ⸢render•path⸥

    '
  fields:
  - name: path
    type: str
    description: Carpeta dentro de frontends/mindmap (app = raíz).
  - name: modules
    type: int
    description: Cantidad de módulos .js/.mjs.
tipos_de_relacion:
- name: depends_on
  cardinality: many_to_many
  axis: HOW
  source_types:
  - Component
  target_types:
  - Component
  description: Algún módulo del origen importa uno del destino. La cantidad de imports va en notes.
documentos:
- model: Component
  name: app
  payload:
    path: app
    modules: 1
- model: Component
  name: dialogs
  payload:
