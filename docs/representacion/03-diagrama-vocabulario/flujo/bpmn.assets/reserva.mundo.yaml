# Colaboración BPMN 'reserva de mesa' (reserva.semantica.bpmn) como mundo pron, generada desde el XML.
# Las reglas de pool se declaran como condition de los verbos de flujo, comparando el campo pool de ambos extremos.
modelos:
- name: Participant
  family: bpmn
  template: '---

    name: ⸢rev•name⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Participante (pool).
- name: Task
  family: bpmn
  template: '---

    name: ⸢rev•name⸥

    kind: ⸢rev•kind⸥

    pool: ⸢rev•pool⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Qué se hace.
  - name: kind
    type: str
    default: task
    description: task, sendTask, receiveTask, userTask…
  - name: pool
    type: str
    description: Id del participante que lo contiene (copia de in_pool, para que la condition de los flujos lo compare).
- name: Event
  family: bpmn
  template: '---

    name: ⸢rev•name⸥

    position: ⸢rev•position⸥

    trigger: ⸢rev•trigger⸥

    pool: ⸢rev•pool⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    description: Qué pasa.
  - name: position
    type: str
    description: start, intermediate o end.
  - name: trigger
    type: str
    default: none
    description: none, message, timer…
  - name: pool
    type: str
    description: Id del participante que lo contiene (copia de in_pool, para que la condition de los flujos lo compare).
- name: Gateway
  family: bpmn
  template: '---

    name: ⸢rev•name⸥

    kind: ⸢rev•kind⸥

    pool: ⸢rev•pool⸥

    ---


    # ⸢render•name⸥

    '
  fields:
  - name: name
    type: str
    default: ''
    description: La pregunta, si la hay.
  - name: kind
    type: str
    description: exclusive, parallel, inclusive, eventBased.
  - name: pool
    type: str
    description: Id del participante que lo contiene (copia de in_pool, para que la condition de los flujos lo compare).
tipos_de_relacion:
- name: in_pool
  cardinality: many_to_one
  axis: WHERE
  source_types:
  - Task
  - Event
  - Gateway
  target_types:
  - Participant
  description: El elemento pertenece al proceso de ese participante.
- name: sequence_flow
  cardinality: many_to_many
  axis: WHEN
  source_types:
  - Task
  - Event
  - Gateway
  target_types:
  - Task
  - Event
  - Gateway
  description: Orden dentro de un proceso. No cruza el borde de un pool (BPMN 2.0, §7.6.2).
  condition: pool = "{pool}"
- name: message_flow
  cardinality: many_to_many
  axis: WHEN
  source_types:
  - Task
  - Event
  target_types:
  - Task
  - Event
  description: Mensaje entre participantes. Une dos pools distintos (BPMN 2.0, §9.3).
  condition: pool != "{pool}"
documentos:
- model: Participant
  name: pool-cliente
  payload:
    name: Cliente
- model: Participant
  name: pool-restaurante
