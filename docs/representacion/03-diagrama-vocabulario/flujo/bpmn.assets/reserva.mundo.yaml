    name: Respuesta recibida
    position: intermediate
    trigger: message
    pool: pool-cliente
- model: Event
  name: cliente-listo
  payload:
    name: Listo
    position: end
    trigger: none
    pool: pool-cliente
- model: Event
  name: pedido-recibido
  payload:
    name: Pedido recibido
    position: start
    trigger: message
    pool: pool-restaurante
- model: Task
  name: buscar-mesa
  payload:
    name: Buscar mesa con capacidad
    kind: task
    pool: pool-restaurante
- model: Gateway
  name: hay-mesa
  payload:
    name: ¿hay mesa libre?
    kind: exclusive
    pool: pool-restaurante
- model: Task
  name: confirmar
  payload:
    name: Confirmar reserva
    kind: task
    pool: pool-restaurante
- model: Task
  name: ofrecer
  payload:
    name: Ofrecer otro horario
    kind: task
    pool: pool-restaurante
- model: Event
  name: confirmacion-enviada
  payload:
    name: Confirmación enviada
    position: end
    trigger: message
    pool: pool-restaurante
- model: Event
  name: alternativa-enviada
  payload:
    name: Alternativa enviada
    position: end
    trigger: message
    pool: pool-restaurante
