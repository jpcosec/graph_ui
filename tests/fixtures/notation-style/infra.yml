# Test notation for the Specs view's glyph style (spec2viz contract §13): every new shape, the default
# palette, palette kinds, a glyph with explicit fill/stroke/icon and a coloured link.
name: infra
title: Infrastructure (style test)
diagram_type: component
level: types
projection: all
palette: default
layout: {kind: graph, direction: TB}

glyphs:
  - {id: database, title: Database, model: SpecNodeDoc, where: kind = "database", shape: cylinder, kind: database, keyword: "«{kind}»", label: "{title}", function: database}
  - {id: queue, title: Queue, model: SpecNodeDoc, where: kind = "queue", shape: queue, kind: queue, keyword: "«{kind}»", label: "{title}", function: queue}
  - {id: external, title: External service, model: SpecNodeDoc, where: kind = "external", shape: cloud, kind: external, keyword: "«{kind}»", label: "{title}", function: external}
  - {id: module, title: Module, model: SpecNodeDoc, where: kind = "module", shape: package, keyword: "«module»", label: "{title}", function: module}
  - {id: note, title: Note, model: SpecNodeDoc, where: kind = "note", shape: note, label: "{title}", function: note}
  - {id: gate, title: Gate, model: SpecNodeDoc, where: kind = "gate", shape: diamond, label: "{title}", function: gate}
  - {id: hot, title: Hot path, model: SpecNodeDoc, where: kind = "hot", shape: box, fill: "#fff1c2", stroke: "#b35900", icon: workflow, label: "{title}", function: hot}
  - {id: component, title: Component, model: SpecNodeDoc, shape: box, label: "{title}", function: component}

links:
  - {id: contains, title: Contains, relation: contains, draw: nest}
  - {id: reads, title: Reads, relation: reads, draw: line, line: dashed, target_end: open-arrow, color: "#0072b2", label: "{relation_type}"}
  - {id: any, title: Relation, relation: "*", draw: line, line: solid, target_end: open-arrow, label: "{relation_type}"}
